[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "commercegov-authority-agent"
version = "0.1.0"
description = "Deterministic authority boundary for CommerceGov operational events"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1,<1",
    "pydantic>=2.13,<3",
    "strands-agents==1.54.0",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
